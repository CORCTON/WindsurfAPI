services:
  windsurf2api:
    image: ghcr.io/dwgx/windsurf-api:latest
    pull_policy: always
    restart: unless-stopped
    init: true
    environment:
      HOST: 0.0.0.0
      PORT: "3003"
      DATA_DIR: /data
      API_KEY: ${WINDSURF_API_KEY:?required}
      DASHBOARD_PASSWORD: ${WINDSURF_DASHBOARD_PASSWORD:?required}
      DEFAULT_MODEL: glm-5-2
      DEVIN_CONNECT: "1"
      DEVIN_CONNECT_LIVENESS_PROBE: "1"
      STICKY_SESSION_ENABLED: "1"
      WINDSURFAPI_SINGLE_TENANT_CACHE: "1"
      WINDSURFAPI_STRICT_MODEL: "1"
      LOG_LEVEL: info
    expose:
      - "3003"
    volumes:
      - windsurf2api-data:/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3003/v1/models',{headers:{authorization:'Bearer '+process.env.API_KEY}}).then(async r=>{if(!r.ok){console.error('catalog_http_'+r.status);process.exit(1)}const b=await r.json();const ids=new Set((b.data||[]).map(m=>m.id));const required=['glm-5-2','swe-1-7-medium'];console.log(JSON.stringify({required,relevant:[...ids].filter(id=>id.includes('glm-5')||id.includes('swe-1-7'))}));process.exit(required.every(id=>ids.has(id))?0:1)}).catch(e=>{console.error(e.message);process.exit(1)})
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 5
    networks:
      - dokploy-network

volumes:
  windsurf2api-data:
    name: windsurf2api-data

networks:
  dokploy-network:
    external: true
